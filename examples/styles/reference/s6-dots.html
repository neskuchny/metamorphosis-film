<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Точки: цифровая скульптура</title>
<link rel="stylesheet" href="../fonts.css">
<style>*{margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#06070A}svg{display:block}text{font-family:'Inter',sans-serif}</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
let seed=5;const r=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const GA=Math.PI*(3-Math.sqrt(5));const C=7.6;
let o=`<defs>
<radialGradient id="glowL" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5B7BA6" stop-opacity=".16"/><stop offset="1" stop-color="#5B7BA6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFA033" stop-opacity=".30"/><stop offset="1" stop-color="#FFA033" stop-opacity="0"/></radialGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs><rect width="1920" height="1080" fill="#06070A"/>`;
const LX=540,LY=568,RX=1500,RY=520;
o+=`<circle cx="${LX}" cy="${LY}" r="620" fill="url(#glowL)"/><circle cx="${RX}" cy="${RY}" r="360" fill="url(#glowR)"/>`;
// left disc: 3000 dots
let L='',Lg='';
for(let i=0;i<3000;i++){const rad=C*Math.sqrt(i+.5),a=i*GA;const x=LX+rad*Math.cos(a),y=LY+rad*Math.sin(a);const t=rad/ (C*Math.sqrt(3000));const base=.62-.3*t;const flick=r()<.06?.55:0;L+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="#8CA6C6" opacity="${(base+flick*(1-t)).toFixed(2)}"/>`}
o+=L;
// right disc: 300 dots (same density)
let R='',Rb='';
for(let i=0;i<300;i++){const rad=C*Math.sqrt(i+.5),a=i*GA;const x=RX+rad*Math.cos(a),y=RY+rad*Math.sin(a);R+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#FFB347"/>`;Rb+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.8" fill="#FF9A1F"/>`}
o+=`<g filter="url(#bl)" opacity=".75">${Rb}</g>${R}`;
// rings
o+=`<circle cx="${LX}" cy="${LY}" r="${C*Math.sqrt(3000)+22}" fill="none" stroke="#8CA6C6" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="3 7"/>`;
o+=`<circle cx="${RX}" cy="${RY}" r="${C*Math.sqrt(300)+22}" fill="none" stroke="#FFB347" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 7"/>`;
// equals
o+=`<g stroke="#E9E4D8" stroke-width="3" stroke-linecap="round"><line x1="1062" y1="500" x2="1138" y2="500"/><line x1="1062" y1="540" x2="1138" y2="540"/></g>`;
o+=`<text x="1100" y="590" text-anchor="middle" font-family="JetBrains Mono" font-size="17" letter-spacing="3" fill="#8E97A3">ТОТ ЖЕ ВЫПУСК</text>`;
// labels
o+=`<text x="96" y="96" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#8E97A3">СЦЕНА 07 · ЛЮДИ В СБОРКЕ · МАСШТАБ 1 ТОЧКА = 1 ЧЕЛОВЕК</text>`;
o+=`<text x="96" y="1010" font-size="34" font-weight="600" fill="#8CA6C6">Вы · 3 000</text>`;
o+=`<text x="1500" y="800" text-anchor="middle" font-size="190" font-weight="800" fill="#FFB347" letter-spacing="-6" transform="translate(0,-0)" opacity="0">300</text>`;
o+=`<text x="1500" y="205" text-anchor="middle" font-size="190" font-weight="800" fill="#FFB347" letter-spacing="-6">300</text>`;
o+=`<text x="1500" y="880" text-anchor="middle" font-size="34" font-weight="600" fill="#FFB347">Аркон · 300</text>`;
o+=`<text x="1500" y="930" text-anchor="middle" font-size="24" font-weight="400" fill="#9B958A">та же плотность, тот же масштаб</text>`;
document.getElementById('s').innerHTML=o;
</script></body></html>
