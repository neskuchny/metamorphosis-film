<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Кинетический плакат</title>
<link rel="stylesheet" href="../fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--y:#E4FF3B;--k:#0B0B0B;--red:#FF2D1A}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--y)}
body{position:relative;font-family:'Oswald',sans-serif;color:var(--k)}
.mono{font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.top{position:absolute;left:56px;right:56px;top:36px;display:flex;justify-content:space-between;border-bottom:4px solid var(--k);padding-bottom:12px}
.big{position:absolute;font-weight:700;line-height:.8;letter-spacing:-.02em;white-space:nowrap}
.a{left:36px;top:86px;font-size:480px}
.b{left:36px;top:520px;font-size:480px;color:transparent;-webkit-text-stroke:6px var(--k)}
.side{position:absolute;left:1180px;top:118px;font-weight:700;font-size:112px;line-height:1.06;text-transform:uppercase;letter-spacing:-.005em}
.side span{display:block}
.side .o{color:transparent;-webkit-text-stroke:3px var(--k)}
.stick{position:absolute;right:92px;top:560px;width:300px;height:300px;border-radius:50%;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);box-shadow:8px 8px 0 var(--k)}
.stick b{font-size:150px;line-height:.9;font-weight:700}
.stick i{font-style:normal;font-size:34px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.tick{position:absolute;left:0;right:0;bottom:0;height:92px;background:var(--k);color:var(--y);overflow:hidden;display:flex;align-items:center;white-space:nowrap;font-weight:500;font-size:60px;letter-spacing:.04em;text-transform:uppercase}
.tick span{padding-left:0;margin-left:-120px}
</style></head><body>
<div class="top"><span class="mono">Аркон / 2031 / сборка</span><span class="mono">07 — 12</span></div>
<div class="big a">300</div>
<div class="side"><span>человек.</span><span class="o">там, где</span><span>у вас</span></div>
<div class="big b">3 000</div>
<div class="stick"><b>÷10</b><i>тот же выпуск</i></div>
<div class="tick"><span>ТОТ ЖЕ ВЫПУСК / ТОТ ЖЕ ВЫПУСК / ТОТ ЖЕ ВЫПУСК / ТОТ ЖЕ ВЫПУСК / ТОТ ЖЕ ВЫПУСК / ТОТ ЖЕ ВЫПУСК / ТОТ ЖЕ ВЫПУСК /</span></div>
</body></html>
