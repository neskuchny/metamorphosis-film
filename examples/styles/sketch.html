<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Рисованная доска (знание-дизайн)</title>
<link rel="stylesheet" href="fonts.css"><script src="rough.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#F6F1E4}
svg{display:block}
text{font-family:'Caveat',cursive;font-weight:700}
</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .5 0"/></filter>
<radialGradient id="vg" cx=".5" cy=".5" r=".8"><stop offset=".55" stop-color="#8a6f3a" stop-opacity="0"/><stop offset="1" stop-color="#8a6f3a" stop-opacity=".22"/></radialGradient>
</defs>
<rect width="1920" height="1080" fill="#F6F1E4"/>
<rect width="1920" height="1080" fill="url(#vg)"/>
<g id="L0"></g><g id="L1"></g><g id="L2"></g>
<rect width="1920" height="1080" filter="url(#paper)" opacity=".5" style="mix-blend-mode:multiply;pointer-events:none"/>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const INK='#1E2A47', CORAL='#E4573D', TEAL='#3FA7A0';
const gen=rough.generator();
const mk=(tag,at,parent)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e};
const L0=document.getElementById('L0'),L1=document.getElementById('L1'),L2=document.getElementById('L2');
const ease={io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,out:x=>1-Math.pow(1-x,3),back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},lin:x=>x};
const P=(t,a,d,f=ease.io)=>f(Math.min(1,Math.max(0,(t-a)/d)));
const SEEDS=[3,17,41];
const rset=(fn,opt={})=>SEEDS.map(seed=>gen.toPaths(fn({roughness:1.5,bowing:1.1,strokeWidth:3.4,disableMultiStroke:false,seed,...opt})).filter(p=>p.stroke&&p.stroke!=='none').map(p=>p.d).join(' '));
const els=[];
const rect=(x,y,w,h)=>`M${x} ${y}h${w}v${h}h${-w}z`;
const poly=(pts)=>'M'+pts.map(p=>p.join(' ')).join('L')+'z';

// fills sit under ink, shifted a few pixels (misregistration like hand-coloured print)
function fillShape(d,color,at,dur=.5,off=[7,6]){const e=mk('path',{d,fill:color,transform:`translate(${off[0]} ${off[1]})`,opacity:0},L0);els.push({u:(T)=>e.setAttribute('opacity',P(T,at,dur,ease.lin))});}
// ink drawn on like a pen
function ink(fn,t0,dur,{color=INK,w=3.4,opt={}}={}){
  const ds=rset(fn,{strokeWidth:w,...opt});
  const p=mk('path',{d:ds[0],fill:'none',stroke:color,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1},L1);
  let cv=-1;
  els.push({u:(T,v)=>{if(v!==cv){p.setAttribute('d',ds[v]);cv=v}const q=P(T,t0,dur);
    if(q<=0){p.setAttribute('opacity',0)}else{p.setAttribute('opacity',1);if(q>=1)p.removeAttribute('stroke-dasharray');else{p.setAttribute('stroke-dasharray','1 1');p.setAttribute('stroke-dashoffset',1-q)}}}});
}
// a small doodled person that pops in
function person(cx,cy,t0,fill){
  const g=mk('g',{},L1),f=mk('g',{},g);
  const body=`M${cx-12} ${cy+18}Q${cx-12} ${cy-6} ${cx} ${cy-6}Q${cx+12} ${cy-6} ${cx+12} ${cy+18}z`;
  mk('path',{d:body,fill,transform:'translate(3 3)'},f);mk('circle',{cx:cx+3,cy:cy-17+3,r:10,fill},f);
  const dsB=rset(o=>gen.path(body,o),{roughness:1.1,strokeWidth:2.6}),dsH=rset(o=>gen.circle(cx,cy-17,20,o),{roughness:1.1,strokeWidth:2.6});
  const pb=mk('path',{d:dsB[0],fill:'none',stroke:INK,'stroke-width':2.6,'stroke-linecap':'round'},g),ph=mk('path',{d:dsH[0],fill:'none',stroke:INK,'stroke-width':2.6,'stroke-linecap':'round'},g);
  let cv=-1;
  els.push({u:(T,v)=>{if(v!==cv){pb.setAttribute('d',dsB[v]);ph.setAttribute('d',dsH[v]);cv=v}
    const q=P(T,t0,.42,ease.back),a=P(T,t0,.12,ease.lin);g.setAttribute('opacity',a);
    g.setAttribute('transform',`translate(${cx} ${cy+18}) scale(${.2+.8*q}) translate(${-cx} ${-(cy+18)})`)}});
}
function crate(x,y,s,t0){
  const g=mk('g',{},L1);mk('rect',{x:x+3,y:y+3,width:s,height:s,fill:'#F2B84B'},g);
  const ds=rset(o=>gen.rectangle(x,y,s,s,o),{roughness:1.2,strokeWidth:3}),dx=rset(o=>gen.linearPath([[x,y+s*.45],[x+s,y+s*.45]],o),{roughness:1,strokeWidth:2.4});
  const a=mk('path',{d:ds[0],fill:'none',stroke:INK,'stroke-width':3},g),b=mk('path',{d:dx[0],fill:'none',stroke:INK,'stroke-width':2.4},g);let cv=-1;
  els.push({u:(T,v)=>{if(v!==cv){a.setAttribute('d',ds[v]);b.setAttribute('d',dx[v]);cv=v}
    const q=P(T,t0,.4,ease.back);g.setAttribute('opacity',P(T,t0,.1,ease.lin));g.setAttribute('transform',`translate(${x+s/2} ${y+s}) scale(${.3+.7*q}) translate(${-(x+s/2)} ${-(y+s)})`)}});
}
// handwriting revealed left to right
let cid=0;
function write(str,x,y,size,color,t0,dur,{rot=0,anchor='start',w=900}={}){
  const id='c'+(cid++);const cp=mk('clipPath',{id},document.querySelector('defs'));const r=mk('rect',{x:x-20,y:y-size,width:0,height:size*1.4},cp);
  const t=mk('text',{x,y,'font-size':size,fill:color,'text-anchor':anchor,'clip-path':`url(#${id})`,transform:rot?`rotate(${rot} ${x} ${y})`:''},L2);t.textContent=str;
  els.push({u:(T)=>{const box=t.getBBox();const q=P(T,t0,dur,ease.io);r.setAttribute('x',box.x-10);r.setAttribute('y',box.y-8);r.setAttribute('height',box.height+16);r.setAttribute('width',(box.width+20)*q)}});
}

// Text of the scene. Override from the command line: node scripts/clip.mjs ... --text '{"title":"...","you":"600","them":"60"}'
// Keep it short: title <= 38 chars, numbers <= 6 chars, same <= 16, legend <= 30. Cyrillic and Latin only.
// n_you (1..30) and n_them (1..10) are the figure counts: pick them so the picture keeps the real proportion.
const TEXT=Object.assign({title:'Тот же выпуск — десятая часть людей',you:'3 000',same:'тот же выпуск',them:'300',legend:'1 фигурка = 100 человек',n_you:30,n_them:3},window.TEXT||{});
const NY=Math.max(1,Math.min(30,Math.round(+TEXT.n_you||30))),NT=Math.max(1,Math.min(10,Math.round(+TEXT.n_them||3)));
// ---------- the scene ----------
write(TEXT.title,110,128,92,INK,.2,1.5,{rot:-1});
ink(o=>gen.linearPath([[470,152],[820,146],[1200,154]],o),1.5,.6,{color:CORAL,w:5});

// factory (you)
const body=[[130,480],[890,480],[890,820],[130,820]];
fillShape(poly(body),'#CFE0F2',1.6);ink(o=>gen.polygon(body,o),.5,1.1,{w:3.8});
const saw=[];for(let i=0;i<6;i++){saw.push([130+i*126.7,480],[130+i*126.7,412])}saw.push([890,480]);
fillShape(poly([...saw,[890,480]]),'#AFC8E3',1.6);ink(o=>gen.linearPath(saw,o),1.0,.9,{w:3.6});
fillShape(rect(620,330,46,150),'#AFC8E3',1.7);ink(o=>gen.rectangle(620,330,46,150,o),1.3,.5);
fillShape(rect(760,360,40,120),'#AFC8E3',1.7);ink(o=>gen.rectangle(760,360,40,120,o),1.5,.5);
ink(o=>gen.curve([[643,322],[620,290],[666,262],[640,226]],o),2.0,.7,{w:3});
ink(o=>gen.curve([[780,352],[758,322],[800,296],[776,262]],o),2.2,.7,{w:3});
fillShape(rect(480,700,110,120),'#8FA9C7',1.7);ink(o=>gen.rectangle(480,700,110,120,o),1.6,.5);
for(let r=0;r<2;r++)for(let c=0;c<7;c++){const x=160+c*98,y=530+r*80;fillShape(rect(x,y,66,44),'#FFE08A',2.0+c*.03);ink(o=>gen.rectangle(x,y,66,44,o),1.7+c*.04,.35,{w:2.6})}
// ground
ink(o=>gen.line(60,822,1840,822,o),.3,1.2,{w:3});

// crowd: 30 figures = 3 000 people
write(TEXT.you,130,305,150,INK,3.0,.9,{rot:-2});
for(let k=0;k<NY;k++){const r=Math.floor(k/15),c=k%15;person(150+c*53,905+r*78,3.1+k*0.045,'#8DB7E8')}

// challenger (them)
const nb=[[1270,600],[1560,600],[1560,820],[1270,820]];
fillShape(poly(nb),'#BFE5DF',4.9);ink(o=>gen.polygon(nb,o),4.2,.9,{w:3.8});
ink(o=>gen.line(1262,596,1568,596,o),4.9,.3,{w:4.4});ink(o=>gen.line(1415,596,1415,540,o),5.0,.3,{w:3});ink(o=>gen.circle(1415,532,16,o),5.1,.25,{w:3});
fillShape(rect(1300,640,130,90),'#FFD166',5.1);ink(o=>gen.rectangle(1300,640,130,90,o),4.9,.4,{w:3});ink(o=>gen.line(1365,640,1365,730,o),5.1,.2,{w:2.4});
fillShape(rect(1460,720,70,100),'#8CC8C0',5.1);ink(o=>gen.rectangle(1460,720,70,100,o),5.0,.3,{w:3});
{const per=NT<=4?NT:Math.ceil(NT/2),gap=NT<=4?70:56,x0=1415-(per-1)*gap/2;for(let i=0;i<NT;i++)person(x0+(i%per)*gap,905+Math.floor(i/per)*78,5.6+i*.15,'#F26B50')}

// the same output
const SZ=44;
[[960,776],[1006,776],[1052,776],[983,732],[1029,732]].forEach((p,i)=>crate(p[0],p[1]-0,SZ,6.3+i*.1));
[[1610,776],[1656,776],[1702,776],[1633,732],[1679,732]].forEach((p,i)=>crate(p[0],p[1],SZ,6.5+i*.1));
ink(o=>gen.line(1150,600,1212,598,o),7.0,.3,{color:CORAL,w:5.5});ink(o=>gen.line(1150,634,1212,636,o),7.2,.3,{color:CORAL,w:5.5});
write(TEXT.same,1000,872,50,CORAL,7.3,.8,{rot:-2});

// numbers
{const n=String(TEXT.them).length,sz=n<=3?176:Math.round(176*3.4/n);write(TEXT.them,1440,512-(176-sz)*.25,sz,CORAL,7.9,.8,{rot:-3,anchor:'middle'})}
ink(o=>gen.ellipse(1440,462,330,170,o),8.6,.9,{color:CORAL,w:6,opt:{roughness:2}});
write(TEXT.legend,1200,1040,40,'#6c7898',9.0,.8);

window.__seek=function(T){const v=Math.floor(T*8)%3;for(const e of els)e.u(T,v);return true};
document.fonts.ready.then(()=>{window.__seek(0);window.__ready=true});
const qT=new URLSearchParams(location.search).get('t');if(qT!==null)document.fonts.ready.then(()=>window.__seek(+qT));
</script></body></html>
